# Frontend deploy config (Netlify).
#
# The frontend is a fully static export (next.config.ts -> output: "export"),
# so Netlify only serves files from frontend/out - there are no serverless
# functions and no Next runtime here.
#
# IMPORTANT: NEXT_PUBLIC_API_URL is read at BUILD time and inlined into the
# static output, so it must be set in Netlify's environment variables (Site
# settings -> Environment variables) BEFORE building - changing it later
# requires a rebuild, not just a restart. It must point at the public backend
# origin, e.g. https://ksrm-backend.onrender.com (no trailing slash).

[build]
  base    = "frontend"
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"

# No catch-all redirect on purpose: the export emits real .html files (Netlify
# resolves /about -> /about.html itself) plus a 404.html. An SPA-style
# "/* -> /index.html 200" rule would swallow those and serve the homepage for
# every unknown URL instead of the 404 page.

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    cache-control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options        = "SAMEORIGIN"
    Referrer-Policy        = "strict-origin-when-cross-origin"
