# Frontend deploy config (Netlify).
#
# The frontend is a fully static export (next.config.ts -> output: "export"),
# so Netlify only serves files from frontend/out - there are no serverless
# functions and no Next runtime here.
#
# NEXT_PUBLIC_API_URL is read at BUILD time and inlined into the static output.
# It is pinned here rather than left to the Netlify UI because forgetting it does
# not fail the build - it silently ships a broken site, in two different ways:
#   - lib/api-base.ts, media-api.ts, audit-logs-api.ts and
#     career-applications-api.ts fall back to http://localhost:4000, so every
#     image and document points at the visitor's own machine
#   - lib/api-client.ts falls back to "" (relative), so every API call goes to
#     this Netlify origin, which serves no API, and 404s
# Neither shows up in the build log. Keeping it in version control means the
# value that ships is reviewable in a diff.
#
# Changing it requires a REBUILD, not a restart - it is baked into the HTML/JS.
# No trailing slash.

[build]
  base    = "frontend"
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION        = "22"
  NEXT_PUBLIC_API_URL = "https://ksrm-backend.onrender.com"

# No catch-all redirect on purpose: the export emits real .html files (Netlify
# resolves /about -> /about.html itself) plus a 404.html. An SPA-style
# "/* -> /index.html 200" rule would swallow those and serve the homepage for
# every unknown URL instead of the 404 page.

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    cache-control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options        = "SAMEORIGIN"
    Referrer-Policy        = "strict-origin-when-cross-origin"
