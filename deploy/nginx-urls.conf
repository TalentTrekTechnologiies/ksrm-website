# URL behaviour for a site whose links are handed out rather than browsed.
#
# NAAC and NBA reviewers are given URLs directly - they do not search the site
# - so a URL either resolves to the right page or must say plainly that it does
# not. Today every unknown path returns 200 with the HOMEPAGE:
#
#     /naac-evidence-3-1-2/   200   K.S.R.M. College of Engineering | KSRMCE
#     /typo-page/             200   K.S.R.M. College of Engineering | KSRMCE
#
# A reviewer following a link with a typo, or one for a page not yet
# published, lands on the homepage and concludes the evidence does not exist -
# or that they are being misdirected. It also tells search engines that every
# wrong URL is a real page, which is how duplicate soft-404s get indexed.
#
# Paste these three blocks inside the server block, replacing the existing
# "location /" block. Then:
#     sudo nginx -t && sudo systemctl reload nginx

# ---------------------------------------------------------------------------
# 1. Pages created in the CMS but not yet built.
#
# The site is a static export: /committees/<slug>/ and /departments/<slug>/
# exist only once a build has produced them. A committee or department created
# in the CMS appears in the menus immediately - those read the API live - but
# its own page does not exist until the next deploy.
#
# In that window these fall back to the section index, which lists it, rather
# than to the homepage or a bare 404. The reader still reaches what they came
# for. Keep these ABOVE the general rule below.
# ---------------------------------------------------------------------------
location /committees/ {
    try_files $uri $uri/ /committees/index.html;
}

location /departments/ {
    try_files $uri $uri/ /departments/index.html;
}

# ---------------------------------------------------------------------------
# 2. Everything else: a real 404 when the page is not there.
#
# "=404" rather than falling back to /index.html. The old fallback is what made
# every wrong URL answer 200 with the homepage.
#
# error_page then serves the site's own 404 page, so a reviewer sees a KSRMCE
# page saying the link is wrong - with the header, the menu and a way back -
# and the response still carries a 404 status, which is what stops search
# engines indexing it.
# ---------------------------------------------------------------------------
location / {
    try_files $uri $uri/ =404;

    # HTML must revalidate. Without this the browser caches pages on its own
    # schedule and a reviewer can be served a copy from before the evidence
    # was published. The hashed assets under /_next/static keep their
    # long-lived immutable caching - only the HTML is affected.
    add_header Cache-Control "public, max-age=0, must-revalidate";
}

error_page 404 /404.html;
location = /404.html {
    internal;
    add_header Cache-Control "public, max-age=0, must-revalidate";
}
