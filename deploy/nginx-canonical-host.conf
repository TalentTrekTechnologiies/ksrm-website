# www -> apex canonical host redirect.
#
# THIS IS THE HIGHEST-VALUE REMAINING SEO ITEM and it is the one thing that
# cannot be fixed from the codebase.
#
# WHY IT MATTERS
#
# Every page now declares its canonical URL as https://ksrmce.ac.in/... (no
# www), decided with the client on 2026-08-13 and set once in
# frontend/lib/seo.ts. But the server still answers on BOTH hostnames with the
# same content, so search engines see two complete copies of the site and split
# the ranking signals between them. Until this redirect exists, part of the SEO
# work is being undone at the network layer.
#
# HOW TO INSTALL
#
#   1. Save this file as /etc/nginx/sites-available/ksrmce-canonical-host.conf
#      (or paste the server blocks into the existing config).
#   2. sudo nginx -t          # must pass before reloading
#   3. sudo systemctl reload nginx
#
# The certificate must cover BOTH names or the HTTPS redirect cannot complete -
# a browser validates the certificate BEFORE it sees the 301. Issue with:
#
#   sudo certbot --nginx -d ksrmce.ac.in -d www.ksrmce.ac.in
#
# HOW TO VERIFY (expect "301" then "200"):
#
#   curl -sI https://www.ksrmce.ac.in/            | head -n 1
#   curl -sI https://www.ksrmce.ac.in/            | grep -i ^location
#   curl -sI https://ksrmce.ac.in/                | head -n 1
#
# A request to https://www.ksrmce.ac.in/departments/cse/ must answer
# 301 -> https://ksrmce.ac.in/departments/cse/ - same path, one hop.

# --------------------------------------------------------------------------
# 1. www over HTTPS -> apex.
#    $request_uri is used (not $uri) so the query string and the exact path
#    survive the redirect. 301, not 302: a temporary redirect does not
#    consolidate ranking signals, which is the entire point of this file.
# --------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.ksrmce.ac.in;

    # Must be the certificate covering www (see certbot command above).
    ssl_certificate     /etc/letsencrypt/live/ksrmce.ac.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ksrmce.ac.in/privkey.pem;

    return 301 https://ksrmce.ac.in$request_uri;
}

# --------------------------------------------------------------------------
# 2. Plain HTTP on either hostname -> HTTPS apex, in ONE hop.
#
#    Sending http://www -> https://www -> https://apex would work but chains
#    two redirects, and chains pass less signal. This lands both on the
#    canonical URL directly.
#
#    Leave any existing ACME challenge location ahead of this, or certbot
#    renewals will be redirected away and fail.
# --------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name ksrmce.ac.in www.ksrmce.ac.in;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://ksrmce.ac.in$request_uri;
    }
}

