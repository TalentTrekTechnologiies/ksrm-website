# ---------------------------------------------------------------------------
# Department URL aliases (added in the 2026-08 SEO pass)
#
# These are NOT legacy PHP URLs - they are alias slugs the new site used to
# build as real pages. app/departments/[slug]/page.tsx no longer emits them
# (see the comment on generateStaticParams), because a static export cannot
# return a 301 from Next's redirect(): it emitted a thin HTTP 200 page with the
# generic homepage title, no <h1> and no canonical instead. Seven indexable
# near-duplicates, plus two exact copies of real department pages.
#
# Nothing is built at these paths now, so these rules are what serves them.
# They must stay in sync with DUPLICATE_SLUGS / CSE_ALIASES in that page file.

# Regex (not `location =`) so both /departments/aids and /departments/aids/
# match - the site runs with trailingSlash: true, so the slashed form is the
# one most links use, and an exact-match rule would miss it and 404.
#
# AI & ML and Data Science are specialisations offered under CSE, not separate
# departments, so every historical variant consolidates into the CSE page.
location ~ ^/departments/(aids|ai-ds|aiml|ai-ml|data-science|cse-ds|cse-aiml)/?$ {
    return 301 /departments/cse/;
}

# Long-form slugs duplicating a department that already has a canonical short
# form. Both used to build as full pages, each canonicalising to itself.
location ~ ^/departments/mechanical/?$          { return 301 /departments/mech/; }
location ~ ^/departments/humanities-sciences/?$ { return 301 /departments/hs/; }

# NOTE: the three thin CMS shells (/academics/admissions, /academics/diploma,
# /campus-life/edc) are deliberately NOT redirected. They are still built and
# may hold CMS copy; redirecting would make it unreachable. Each carries
# `noindex, follow` in its own metadata and its inbound internal links now point
# at the real page, which removes it from search results without losing content.
