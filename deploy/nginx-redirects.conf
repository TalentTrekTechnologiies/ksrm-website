# 301 redirects from the OLD PHP site (*.php) to the new routes.
# Use this on the VPS (Nginx). Paste these lines INSIDE the `server { }` block
# that serves ksrmce.ac.in, above the main `location / { ... }`.
# Purpose: preserve Google rankings when the new site replaces the old one -
# every indexed old URL 301s to its new equivalent instead of 404ing.
# (The Hostinger/Apache equivalent lives in frontend/public/.htaccess.)
#
# TRAILING SLASHES: every target below ends in "/" because next.config.ts sets
# `trailingSlash: true` - /departments/cse is itself a redirect to
# /departments/cse/, so a target without the slash makes each legacy hit a
# 301 -> 301 chain. Search engines follow chains but pass less signal through
# them, and these are exactly the URLs whose ranking this file exists to
# preserve.
#
# HOST CANONICALISATION: the canonical origin is https://ksrmce.ac.in (no www),
# confirmed 2026-08-13. Add a server block that 301s www -> apex, or the two
# hosts compete for the same content:
#
#   server {
#     server_name www.ksrmce.ac.in;
#     return 301 https://ksrmce.ac.in$request_uri;
#   }

location = /index.php { return 301 /; }

# Departments
location = /cen.php  { return 301 /departments/civil/; }
location = /csen.php { return 301 /departments/cse/; }
location = /eeen.php { return 301 /departments/eee/; }
location = /ecen.php { return 301 /departments/ece/; }
location = /mech.php { return 301 /departments/mech/; }
location = /hasn.php { return 301 /departments/hs/; }
location = /MBA.php  { return 301 /departments/mba/; }

# About & leadership (space-containing old filenames handled via rewrite)
location = /college.php   { return 301 /about/; }
location = /director.php  { return 301 /about/managing-director/; }
location = /principal.php { return 301 /about/principal/; }
location = /jbos.php      { return 301 /about/; }
rewrite ^/Correspondent(%20|\s)Maam\.php$ /about/correspondent/ permanent;
rewrite ^/vice(%20|\s)chairman(%20|\s)sir\.php$ /about/chairman/ permanent;

# Academics
location = /academic.php    { return 301 /academics/courses-intake/; }
location = /admission.php   { return 301 /admissions/; }
location = /fee.php         { return 301 /academics/fee-structure/; }
location = /examportal.php  { return 301 /academics/academic-calendar/; }
location = /SyllabusAll.php { return 301 /academics/syllabus/; }
location = /regulations.php { return 301 /academics/regulations/; }

# Quality / NAAC
location = /iqac.php  { return 301 /iqac/; }
location = /NAAC.php  { return 301 /naac/; }
location = /DVV2.php  { return 301 /naac/; }
location = /nirf.php  { return 301 /accreditation/; }
location = /ARIIA.php { return 301 /accreditation/; }

# Training & Placements
location = /tap.php             { return 301 /placements/overview/; }
location = /partners.php        { return 301 /placements/our-recruiters/; }
location = /pprecord.php        { return 301 /placements/placements-record/; }
location = /pptraining.php      { return 301 /placements/trainings/; }
location = /tapregistration.php { return 301 /placements/; }
location = /ctap.php            { return 301 /contact/; }

# Campus life
location = /campusnew.php     { return 301 /campus-life/campus-facilities/; }
# Was /campus-life/edc/ - that route is a near-empty CMS shell which is now
# noindexed as a duplicate, so the legacy 301 was landing traffic and link
# equity on the weaker of the two EDC pages. /edc/ is the real one.
location = /edc.php           { return 301 /edc/; }
location = /nss.php           { return 301 /campus-life/nss/; }
location = /startup.php       { return 301 /campus-life/startup-cell/; }
location = /libruf2.php       { return 301 /campus-life/library/; }
location = /hostel.php        { return 301 /campus-life/hostels/; }
location = /transport.php     { return 301 /campus-life/transport/; }
location = /sport.php         { return 301 /campus-life/sports/; }
location = /antiragging.php   { return 301 /campus-life/anti-ragging/; }
location = /grievancecell.php { return 301 /campus-life/grievance/; }
location = /cultural.php      { return 301 /campus-life/cultural/; }

# Old-site pages still linked to from the new site's own content (IQAC's
# feedback forms, governing body, etc) - these 404 on launch without redirects.
location = /AlumniFeedback.php   { return 301 "/iqac/#survey"; }
location = /StudentFeedback.php  { return 301 "/iqac/#survey"; }
location = /ParentFeedback.php   { return 301 "/iqac/#survey"; }
location = /TeacherFeedback.php  { return 301 "/iqac/#survey"; }
location = /EmployerFeedback.php { return 301 "/iqac/#survey"; }
