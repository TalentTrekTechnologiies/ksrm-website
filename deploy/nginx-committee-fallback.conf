# A newly created committee, before the site has been rebuilt.
#
# The site is a static export: /committees/<slug>/ exists only if it was
# generated by a build. Creating a committee in the CMS makes it appear in the
# "More" menu and on the committees index straight away - both read the API
# live - but its own page does not exist until someone rebuilds and deploys.
#
# Without this block, clicking that menu entry in the gap hits the site-wide
# try_files fallback and lands on the HOMEPAGE, with a 200 and no error
# anywhere. That is the single most confusing failure this site has: the page
# looks like it worked, it just shows the wrong thing.
#
# Falling back to the committees index instead means the visitor lands on a
# page that lists every committee - including the new one, fetched live - so
# they can still reach what they came for, and it is obvious the deep link is
# not ready rather than mysteriously wrong.
#
# Paste inside the server block, ABOVE the general "location /" block, then:
#   sudo nginx -t && sudo systemctl reload nginx

location /committees/ {
    try_files $uri $uri/ /committees/index.html;
}

# Same reasoning for departments, which have exactly the same arrangement -
# created in the CMS, page produced at build time.
location /departments/ {
    try_files $uri $uri/ /departments/index.html;
}
