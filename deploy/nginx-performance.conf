# Performance config for the static export, for the VPS Nginx.
#
# Paste INSIDE the `server { }` block that serves ksrmce.ac.in (the same one
# that carries deploy/nginx-redirects.conf).
#
# Written during the 2026-08 performance pass, which found two gaps in the
# earlier NGINX-PERFORMANCE.md draft that between them account for most of the
# site's "slow loading" on a real connection. Both are one-line fixes with a
# large effect, so read the two notes below before editing this file.
#
# ---------------------------------------------------------------------------
# GAP 1 - JavaScript was NOT being compressed.
#
# The old gzip_types list was:
#     application/json application/javascript text/css text/plain image/svg+xml
#
# nginx 1.21.1 changed the default MIME type for .js from
# `application/javascript` to `text/javascript`, and Ubuntu 22.04/24.04 ship
# 1.18/1.24 - so on the VPS, .js files are served as `text/javascript`, which
# that list does not match. Every JavaScript file was therefore sent
# uncompressed.
#
# Measured on this build: the homepage loads 13 JS files totalling ~936 KB
# uncompressed, which gzip takes to roughly 270 KB. That is ~660 KB of
# needless transfer on the first visit to any page.
#
# Both spellings are listed below so the config is correct on any nginx
# version. `text/html` is deliberately absent - nginx always gzips it and
# listing it logs a duplicate-MIME warning.
#
# ---------------------------------------------------------------------------
# GAP 2 - JS and CSS were NOT being cached.
#
# The old cache block matched only (webp|png|jpe?g|svg|woff2|mp4). Next.js
# emits its bundles under /_next/static/ with a content hash in the filename,
# which is the textbook case for a one-year immutable cache - a changed file
# gets a new name, so it can never be served stale. Without it, a returning
# visitor re-downloaded every chunk on every page view.
# ---------------------------------------------------------------------------

# Serve a .webp automatically to browsers that accept it, when one sits next to
# the .jpg/.png. Requires the `map` at http{} level, NOT inside server{}:
#
#     map $http_accept $webp_suffix {
#         default  "";
#         "~*webp" ".webp";
#     }

gzip              on;
gzip_comp_level   5;
gzip_min_length   256;
gzip_proxied      any;
gzip_vary         on;
gzip_types
    text/javascript
    application/javascript
    application/json
    text/css
    text/plain
    text/xml
    application/xml
    image/svg+xml
    application/manifest+json;

# Brotli, if the module is available (nginx-extras / libnginx-mod-brotli).
# Roughly 15-20% smaller than gzip on JS and CSS. Safe to omit - if the module
# is not installed nginx will fail to start with "unknown directive", so
# uncomment only after `nginx -t` passes with it.
#
# brotli            on;
# brotli_comp_level 5;
# brotli_types      text/javascript application/javascript application/json
#                   text/css text/plain image/svg+xml;

# Next.js build output: content-hashed filenames, so this can never go stale.
location /_next/static/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
}

# Fonts. Also content-stable, and blocking for text rendering.
location ~* \.(woff2?|ttf|otf|eot)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header Access-Control-Allow-Origin "*";
    access_log off;
}

# Photographs: try a sibling .webp first, fall back to the original.
# `Vary: Accept` is required or a cache could hand a WebP to a client that
# never asked for one.
location ~* ^(?<img_path>/.+)\.(jpe?g|png)$ {
    add_header Vary Accept;
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $img_path$webp_suffix $uri =404;
}

# Everything else static and content-stable.
#
# NOTE: these are the ORIGINAL filenames, which the CMS also stores URLs
# against - so they are cached for a year but are NOT content-hashed. If an
# image is ever replaced in place under the same name, it will stay cached for
# up to a year. Upload replacements through the Media Library (which versions
# the filename) rather than overwriting files on disk.
location ~* \.(webp|svg|ico|mp4|webm|pdf)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
}

# The HTML itself must NOT be cached like this: it is how visitors discover a
# new deployment. Short cache, always revalidated.
location ~* \.html$ {
    add_header Cache-Control "public, max-age=0, must-revalidate";
}
